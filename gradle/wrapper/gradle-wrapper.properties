# Gradle Wrapper properties
#
# NOTE: The Gradle distribution is downloaded directly on the CI runner
# (see .github/workflows/android-ci.yml), so this wrapper is not used for
# automated builds. It is kept for local convenience once a machine with
# Gradle 8.14 is available.
#
distributionUrl=https\://gradle.org/distributions/gradle-8.14-bin.zip
distributionSha256= # filled in once the archive is verified
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStorePath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
