# Gradle Wrapper properties

# NOTE: The Gradle 8.14 distribution must be present to build. The official
# distribution host (services.gradle.org / gradle.org) is unreachable or extremely
# slow from this build environment, so the wrapper has not been pre-populated.
#
# To build, obtain gradle-8.14-bin.zip (see PROGRESS.md "Build toolchain blocker"),
# extract it, and either:
#   (a) run `gradle` directly from the extracted bin/, or
#   (b) place it so the wrapper can resolve distributionUrl.
#
# Once the distribution is available locally, point distributionUrl at it or run
# the extracted gradle binary:
#
#   export ANDROID_HOME=/opt/android
#   export PATH=/opt/android/gradle-8.14/bin:$PATH
#   export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-arm64
#   cd /root/projects/ASTRA
#   gradle :app:assembleDebug
#
distributionUrl=https\://gradle.org/distributions/gradle-8.14-bin.zip
distributionSha256= # filled in once the archive is verified
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStorePath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
